<!DOCTYPE html>
<html lang="en">  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="Snake 3D" />
    <title>Snake 3D Game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="difficulty-styles.css" />
  </head>
  <body>
    <!-- Snake‐segments HUD -->
    <div
      id="snake-segments-ui"
      class="fixed top-4 left-4 flex items-center z-50 space-x-3"
    >
      <div id="segments-container" class="flex space-x-2"></div>
      <span
        id="segments-counter"
        class="text-white font-bold text-2xl lg:text-3xl"
      ></span>
    </div>

    <script type="module" src="/main.js"></script>
    <audio
      id="audio"
      class="fixed top-0 left-0 z-50"
      controls
      loop="true"
      src="/short-audio.mp3"
    ></audio>
    <button
      id="btn-settings"
      class="fixed w-max drop-shadow-xl top-[80%] lg:top-[65%] z-50 flex items-center justify-center"
    >
      <!-- Gear icon overlay -->      
       <img
        src="/Gear.svg"
        class="absolute w-10 h-10 lg:w-16 lg:h-16 pointer-events-none z-10"
        alt="Settings Gear"
      />
      <img
        id="btn-settings-img"
        class="h-[4rem] lg:h-[7rem]"
        src="/ThemeBtn/green/GreenSettings.svg"
        alt="Settings Background"
      />
      <span class="absolute btn-text">settings</span>
    </button>
    <button
      id="btn-play"
      class="fixed w-max drop-shadow-xl top-[80%] lg:top-[65%] left-1/2"
    >
      <img
        id="btn-play-img"
        class="h-[4rem] lg:h-[7rem]"
        src="/ThemeBtn/green/GreenPlay.svg"
        alt=""
      />
      <span class="absolute btn-text">play</span>
    </button>
    <button
      id="btn-volume"
      class="fixed w-max drop-shadow-xl hover:bg-black/30 rounded-[7px] left-4 bottom-20 after:hidden after:content-[''] after:bg-red-500 after:h-1 after:w-20 after:rotate-45 after:absolute after:top-1/2"
    >
      <img
        id="btn-volume-img"
        class="aspect-square w-20"
        src="/ThemeBtn/green/GreenAudio.svg"
        alt="Toggle Audio"
      />
      <span class="absolute btn-text">mute</span>
    </button>
    <button
      id="btn-toggle-camera"
      class="fixed w-max drop-shadow-xl hover:bg-black/30 rounded-[7px] left-4 bottom-40 mb-6 after:hidden after:content-[''] after:bg-red-500 after:h-1 after:w-20 after:rotate-45 after:absolute after:top-1/2"
    >
      <img
        id="btn-toggle-camera-img"
        class="aspect-square w-20"
        src="/ThemeBtn/green/GreenCamera.svg"
        alt="Toggle Camera"
      />
      <span class="absolute btn-text">camera</span>
    </button>
    <ul class="fixed left-4 flex lg:flex-col gap-3 lg:gap-4 bottom-4 lg:bottom-auto lg:top-1/2 lg:-translate-y-1/2 z-50">
      <li
        data-color="green"
        class="cursor-pointer theme-selector"
      >
        <img
          class="aspect-square hover:scale-110 transition-transform duration-150 ease-in-out rounded-full w-14 h-14 lg:w-20 lg:h-20"
          src="/ThemeBtn/green/GreenTheme.svg"
          alt=""
        />
      </li>
      <li
        data-color="orange"
        class="cursor-pointer theme-selector"
      >
        <img
          class="aspect-square hover:scale-110 transition-transform duration-150 ease-in-out rounded-full w-14 h-14 lg:w-20 lg:h-20"
          src="/ThemeBtn/orange/OrangeTheme.svg"
          alt=""
        />
      </li>
      <li
        data-color="lilac"
        class="cursor-pointer theme-selector"
      >
        <img
          class="aspect-square hover:scale-110 transition-transform duration-150 ease-in-out rounded-full w-14 h-14 lg:w-20 lg:h-20"
          src="/ThemeBtn/lilac/LilacTheme.svg"
          alt=""
        />
      </li>
    </ul>    <!-- Difficulty Selection Modal -->
    <div id="difficulty-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
      <div class="bg-gray-800 rounded-lg p-8 max-w-md w-full mx-4 transform scale-90 transition-transform duration-300">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Selecione a Dificuldade</h2>
        
        <div class="space-y-4">
          <!-- Easy -->
          <button id="difficulty-easy" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200">
            <div class="text-lg">🟢 Fácil</div>
            <div class="text-sm opacity-80">Velocidade: Lenta | Frutas: 2 | Bombas: 0 | Objetos: 10</div>
          </button>
          
          <!-- Normal -->
          <button id="difficulty-normal" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200">
            <div class="text-lg">🟡 Normal</div>
            <div class="text-sm opacity-80">Velocidade: Média | Frutas: 1 | Bombas: 1 | Objetos: 20</div>
          </button>
          
          <!-- Hard -->
          <button id="difficulty-hard" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200">
            <div class="text-lg">🔴 Difícil</div>
            <div class="text-sm opacity-80">Velocidade: Rápida | Frutas: 1 | Bombas: 3 | Objetos: 30 | Morte nas bordas</div>
          </button>
          
          <!-- Custom -->
          <button id="difficulty-custom" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200">
            <div class="text-lg">⚙️ Personalizado</div>
            <div class="text-sm opacity-80">Configure as definições manualmente</div>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="settings-tab" class="settings-tab">
      <div class="settings-line"></div>
    </div>

    <!-- Settings Sidebar -->
    <div id="settings-sidebar" class="settings-sidebar">
      <h2 class="text-xl font-bold text-white mb-4">Settings</h2>      <div class="setting-item mb-4">
        <label for="fruits-range" class="text-white">Nº of fruits: <span id="fruits-value">1</span></label>
        <input id="fruits-range" type="range" min="1" max="10" value="1" class="w-full" />
      </div>
      <div class="setting-item mb-4">
        <label for="bombs-range" class="text-white">Nº of bombs: <span id="bombs-value">1</span></label>
        <input id="bombs-range" type="range" min="0" max="10" value="1" class="w-full" />
      </div>
      <div class="setting-item mb-4">
        <label for="objects-range" class="text-white">Nº of objects: <span id="objects-value">20</span></label>
        <input id="objects-range" type="range" min="0" max="50" value="20" class="w-full" />
      </div>
      <div class="setting-item mb-4">
        <label for="speed-range" class="text-white">Snake speed: <span id="speed-value">5</span></label>
        <input id="speed-range" type="range" min="1" max="10" value="5" class="w-full" />
      </div>      <div class="setting-item">
        <label class="text-white inline-flex items-center">
          <input id="kill-borders" type="checkbox" class="mr-2" /> Kill after trespassing borders
        </label>
      </div>
        <h3 class="text-lg font-bold text-white mt-6 mb-3">Lighting</h3>
      <div class="setting-item mb-2">
        <label class="text-white inline-flex items-center">
          <input id="ambient-light" type="checkbox" checked class="mr-2" /> Ambient Light
        </label>
      </div>
      <div class="setting-item mb-2">
        <label class="text-white inline-flex items-center">
          <input id="directional-light" type="checkbox" checked class="mr-2" /> Directional Light
        </label>
      </div>
      <div class="setting-item">
        <label class="text-white inline-flex items-center">
          <input id="point-light" type="checkbox" checked class="mr-2" /> Point Light
        </label>
      </div>
        <h3 class="text-lg font-bold text-white mt-6 mb-3">Minimap</h3>
      <div class="setting-item mt-2">
        <label class="text-white inline-flex items-center">
          <input id="show-minimap" type="checkbox" checked class="mr-2" /> Show Minimap
        </label>
      </div>
    </div>
    <div id="minimap-container" style="display: none; transform-origin: bottom right;" class="fixed bottom-4 right-4 z-50 bg-black/50 rounded-md p-2 theme-green">
      <div class="text-white text-xs mb-1 font-bold text-center">Minimap</div>
      <canvas id="minimap" width="200" height="200"></canvas>
    </div>
  </body>
</html>
