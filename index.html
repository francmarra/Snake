<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta property="og:title" content="Snake 3D" />
		<meta name="description" content="A simple 3D snake indie game!" />
		<meta property="og:description" content="A simple 3D snake indie game!" />
		<meta property="og:url" content="https://snake3d.vercel.app/" />
		<meta property="og:image" content="/og-preview.png" />
		<title>Snake 3D Game</title>
	</head>
	<body>
		<!-- Snake‐segments HUD -->
		<div
			id="snake-segments-ui"
			class="fixed top-4 left-4 flex items-center z-50 space-x-3"
		>
			<div id="segments-container" class="flex space-x-2"></div>
			<span
				id="segments-counter"
				class="text-white font-bold text-2xl lg:text-3xl"
			></span>
		</div>

		<script type="module" src="/main.js"></script>
		<audio
			style="opacity: 0"
			id="audio"
			class="fixed top-0 left-0 z-50"
			controls
			loop="true"
			src="/snake-3d-short-audio.mp3"
		>
			<!-- <a href="/media/cc0-audio/t-rex-roar.mp3"> Download audio </a> -->
		</audio>
		<button
			id="btn-play"
			style="opacity: 0"
			class="fixed w-max drop-shadow-xl top-[75%] lg:top-[60%] left-1/2"
		>
			<img
				id="btn-play-img"
				class="h-[4rem] lg:h-[7rem]"
				src="/ThemeBtn/GreenPlay.svg"
				alt=""
				height="20"
			/>
			<span class="absolute" style="opacity: 0">play</span>
		</button>

		<button
			id="btn-volume"
			style="opacity: 1"
			class="fixed w-max drop-shadow-xl hover:bg-black/30 rounded-[7px] right-4 bottom-4 after:hidden after:content-[''] after:bg-red-500 after:h-1 after:w-20 after:rotate-45 after:absolute after:top-1/2 after:left-1/2 after:-translate-x-1/2 after:-translate-y-1/2"
		>
			<div class="absolute animate-ping inset-0 bg-black/30 scale-125"></div>
			<img
				id="btn-volume-img"
				class="aspect-square w-20"
				src="/ThemeBtn/GreenAudio.svg"
				alt="Toggle Audio"
				height="80"
			/>
			<span class="absolute" style="opacity: 0">mute</span>
		</button>

		<button
			id="btn-toggle-camera"
			style="display: none; position: fixed; top: 10px; right: 10px; z-index: 60; padding: 0.5rem 1rem; background: #fff; border: none; border-radius: 4px; cursor: pointer;"
		>
			<img
				id="btn-toggle-camera-img"
				class="aspect-square w-14"
				src="/ThemeBtn/GreenCamera.svg"
				alt="Toggle Camera"
				height="56"
			/>
		</button>

		<ul
			class="fixed left-4 flex lg:flex-col gap-3 lg:gap-4 bottom-4 lg:bottom-auto lg:top-1/2 lg:-translate-y-1/2 z-50"
		>
			<li style="transform: translateX(-200px)" data-color="green" class="cursor-pointer">
				<img
					class="aspect-square hover:scale-110 transition-transform duration-150 ease-in-out rounded-full border-2 lg:border-4 border-white w-12 h-12 lg:w-16 lg:h-16"
					src="/palette-green.png"
					height="44"
					alt=""
				/>
			</li>
			<li style="transform: translateX(-200px)" data-color="orange" class="cursor-pointer">
				<img
					class="aspect-square hover:scale-110 transition-transform duration-150 ease-in-out rounded-full border-2 lg:border-4 border-white w-12 h-12 lg:w-16 lg:h-16"
					src="/palette-orange.png"
					height="44"
					alt=""
				/>
			</li>
			<li style="transform: translateX(-200px)" data-color="lilac" class="cursor-pointer">
				<img
					class="aspect-square hover:scale-110 transition-transform duration-150 ease-in-out rounded-full border-2 lg:border-4 border-white w-12 h-12 lg:w-16 lg:h-16"
					src="/palette-lilac.png"
					height="44"
					alt=""
				/>
			</li>
		</ul>
	</body>
</html>
